# Cloudflare Pages configuration — DN D&C Project Tracker pilot.
#
# Must live in the PROJECT ROOT. Pages does not accept `--config` with a custom
# path, and a config it cannot find fails SILENTLY: the site boots with no
# bindings and then returns 503 "The project database is not available." on every
# request, which reads like a database fault and is really a file-location fault.
#
# Contains no secrets. Everything here is either a public resource name or a
# non-sensitive setting. Credentials are never stored in this file — the first
# administrator is provisioned directly against D1 (see pages-test/make-login.mjs).

name = "dnc-tracker-pilot"
compatibility_date = "2025-09-01"

# Pages "advanced mode": this directory must contain a single `_worker.js` that
# exports `default { fetch }`. The application already has that shape — no
# rewrite is needed. Generated by `npm run build:pages`.
pages_build_output_dir = "pages-dist"


# --- D1 (active) -------------------------------------------------------------
# Client-owned database. Apply the six migrations in drizzle/ EXACTLY ONCE with
# --remote; 0001/0003/0004/0005 use ALTER TABLE ... ADD COLUMN and are not
# idempotent, so a second run fails with "duplicate column name".
[[d1_databases]]
binding = "DB"
database_name = "dnc-tracker-pilot"
database_id = "94241844-c709-445f-a71c-49f8b65a7cfd"


# --- R2 (PENDING — blocked on payment-method verification) --------------------
# TODO(R2): uncomment this block once the bucket exists in the client account.
#   1. npx wrangler r2 bucket create dnc-tracker-assets
#   2. uncomment the three lines below
#   3. npm run build:pages && npx wrangler pages deploy
#
# Deliberately commented out rather than removed: declaring a binding for a
# bucket that does not exist fails the deploy. The application already degrades
# gracefully without it — `env.BUCKET` is guarded at every use site, so profile
# photo reads/writes return 503 "Photo storage is temporarily unavailable."
# and importRequestedProfilePhotos() returns early. Nothing else is affected and
# NO application code has to change when R2 is switched on.
#
# See worker/index.js: handleAvatar() guards `if (!env.BUCKET)`,
# importRequestedProfilePhotos() opens with `if (!env.BUCKET) return;`
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "dnc-tracker-assets"


# --- Environment variables ---------------------------------------------------
# Non-secret configuration only. Anything sensitive belongs in
# `wrangler pages secret put <NAME>` or the dashboard, never in this file.
[vars]

# SECURITY CRITICAL — must remain "false" (or be removed entirely) in production.
# When "true", platformUserFrom() (worker/index.js:154) trusts the
# `oai-authenticated-user-*` request headers. On ChatGPT Sites a trusted proxy
# injected those; on a public Pages deployment nothing strips them, so ANY
# caller could send one and arrive as an administrator.
ALLOW_PLATFORM_AUTH = "false"

# TODO(config): optional comma-separated list granting the `admin` role by email.
# Intentionally left empty — it does NOT create a login account (it only applies
# to the platform-auth fallback above and to role lookup). The first real
# administrator is provisioned against D1. Set only if the client asks for it.
ADMIN_EMAILS = ""
